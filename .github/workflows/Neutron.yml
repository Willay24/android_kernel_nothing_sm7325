name: Build Kernel LLVM

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: 'Toolchain to build with'
        type: choice
        required: true
        default: 'slim'
        options:
          - slim
          - alchemist
      kernel_branch:
        description: 'Branch to build (must match a branch name exactly)'
        type: string
        required: true
        default: 'Staging-Kernel'
      defconfig:
        description: 'Defconfig name (without path)'
        required: true
        default: 'vendor/lahaina-qgki_defconfig'
      anykernel_branch:
        description: 'AnyKernel3 branch (William24hmar/AnyKernel3) holding your flash script'
        type: string
        default: 'master'
      use_ccache:
        description: 'Use ccache (restore/save cache)'
        type: boolean
        default: true
      build_timestamp:
        description: 'Custom KBUILD_BUILD_TIMESTAMP (leave empty for current time)'
        required: false
        default: ''
      enable_kernelsu:
        description: 'Enable KernelSU'
        type: boolean
        default: false
      use_rekernel:
        description: 'Integrate ReKernel + ReKernel-X (needs KernelSU)'
        type: boolean
        default: false
      enable_nomount:
        description: 'Integrate nomount'
        type: boolean
        default: false
      enable_eva:
        description: 'Integrate E.V.A'
        type: boolean
        default: false
      enable_basebandguard:
        description: 'Integrate Baseband-guard LSM'
        type: boolean
        default: false
      package_modules:
        description: 'Pack .ko modules into the zip'
        type: boolean
        default: false
      pack_7z:
        description: 'Compress Image/dtb/modules into .7z inside the zip (AnyKernel3 must extract them)'
        type: boolean
        default: false
      build_tag:
        description: 'Build tag for ZIP name (e.g., Test/Perf/Normal)'
        default: 'Normal'
      enable_signing:
        description: 'Sign the ZIP with Tenzo keystore'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify branch exists
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.kernel_branch }}
        run: |
          branches=$(gh api "repos/${{ github.repository }}/branches" --paginate -q '.[].name')
          if ! printf '%s\n' "$branches" | grep -Fxq -- "$BRANCH"; then
            echo "::error::Branch '$BRANCH' not found. Available branches:"
            printf '%s\n' "$branches"
            exit 1
          fi
          echo "Branch '$BRANCH' found."

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_branch }}

      - name: Notify Telegram - build start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="html" \
            -d disable_web_page_preview=true \
            -d text="🔨 <b>Kernel Build Triggered</b>%0A<b>Compiler:</b> <code>${{ inputs.compiler }}</code>%0A<b>Branch:</b> <code>${{ inputs.kernel_branch }}</code>%0A<b>Defconfig:</b> <code>${{ inputs.defconfig }}</code>%0A<b>KernelSU:</b> <code>${{ inputs.enable_kernelsu }}</code>%0A<b>ReKernel:</b> <code>${{ inputs.use_rekernel }}</code>%0A<b>Signing:</b> <code>${{ inputs.enable_signing }}</code>%0A<b>Tag:</b> <code>${{ inputs.build_tag }}</code>%0A<b>Triggered by:</b> <code>${{ github.actor }}</code>"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            bc bison flex libssl-dev make libelf-dev lz4 cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential device-tree-compiler \
            python3 python3-pip zip unzip git ccache wget curl xz-utils zstd aria2 \
            clang lld golang \
            default-jre openjdk-21-jdk

      - name: Setup 7za and HDiffPatch
        run: |
          set -e
          SEVENZ_VER="26.03"
          HDIFF_VER="4.12.2"
          BIN_DIR="$HOME/.local/bin"
          WORK="$(mktemp -d)"
          mkdir -p "$BIN_DIR"

          echo "Downloading 7za..."
          cd "$WORK"
          wget -nv "https://github.com/ip7z/7zip/releases/download/${SEVENZ_VER}/7z${SEVENZ_VER//./}-linux-x64.tar.xz" -O 7z.tar.xz
          mkdir 7z && tar -xJf 7z.tar.xz -C 7z
          cp 7z/7zzs "$BIN_DIR/7za"
          chmod +x "$BIN_DIR/7za"

          echo "Downloading HDiffPatch..."
          wget -nv "https://github.com/sisong/HDiffPatch/releases/download/v${HDIFF_VER}/hdiffpatch_v${HDIFF_VER}_bin_linux64.zip" -O hdiffpatch.zip
          "$BIN_DIR/7za" x -y hdiffpatch.zip -ohdiffpatch > /dev/null
          cp hdiffpatch/linux64/hdiffz hdiffpatch/linux64/hpatchz "$BIN_DIR/"
          chmod +x "$BIN_DIR/hdiffz" "$BIN_DIR/hpatchz"

          echo "$BIN_DIR" >> $GITHUB_PATH
          cd "$GITHUB_WORKSPACE"
          rm -rf "$WORK"
          "$BIN_DIR/7za" | sed -n 2p
          "$BIN_DIR/hdiffz" 2>&1 | head -1

      - name: Setup build environment and ccache
        run: |
          if [ "${{ inputs.use_ccache }}" = "true" ]; then
            mkdir -p "${{ github.workspace }}/.ccache"
            echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
            echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV
            echo "USE_CCACHE=1" >> $GITHUB_ENV
            echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
            echo "CCACHE_SLOPPINESS=file_macro,include_file_mtime,time_macros" >> $GITHUB_ENV
          else
            echo "USE_CCACHE=0" >> $GITHUB_ENV
          fi
          BUILD_TIME="${{ inputs.build_timestamp }}"
          echo "KBUILD_BUILD_TIMESTAMP=${BUILD_TIME:-$(date -u +'%a %b %d %H:%M:%S UTC %Y')}" >> $GITHUB_ENV
          echo "GCC_VER=$(aarch64-linux-gnu-gcc --version | head -n1 | awk '{print $NF}')" >> $GITHUB_ENV

      - name: Restore Ccache
        if: ${{ inputs.use_ccache }}
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ inputs.compiler }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.compiler }}-

      - name: Zero ccache stats
        if: ${{ inputs.use_ccache }}
        run: ccache -z

      - name: Install mkdtboimg
        run: |
          set -e
          MKDTBOIMG="/usr/local/bin/mkdtboimg.py"
          if [ -f scripts/mkdtboimg.py ]; then
            sudo cp scripts/mkdtboimg.py "$MKDTBOIMG"
          else
            wget -q "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/master/utils/src/mkdtboimg.py?format=TEXT" -O mkdtboimg_b64.txt
            base64 -d mkdtboimg_b64.txt | sudo tee "$MKDTBOIMG" > /dev/null
            rm mkdtboimg_b64.txt
          fi
          sudo chmod +x "$MKDTBOIMG"
          python3 "$MKDTBOIMG" --help > /dev/null
          echo "MKDTBOIMG=$MKDTBOIMG" >> $GITHUB_ENV

      # ---------------------------------------------------------------
      # Toolchain selection
      # ---------------------------------------------------------------
      - name: Setup Slim LLVM toolchain
        if: ${{ inputs.compiler == 'slim' }}
        run: |
          set -e
          LLVM_VER="23.1.3"
          PREFIX="$HOME/build_toolchain"
          CLANG="llvm-${LLVM_VER}-x86_64"
          mkdir -p "$PREFIX"
          cd "$PREFIX"
          aria2c -q "https://mirrors.edge.kernel.org/pub/tools/llvm/files/$CLANG.tar.xz"
          tar -xJf "$CLANG.tar.xz"

          CLANG_DIR="$PREFIX/$CLANG"
          "$CLANG_DIR/bin/clang" --version | head -1
          "$CLANG_DIR/bin/ld.lld" --version | head -1

          echo "$CLANG_DIR/bin" >> $GITHUB_PATH
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "CLANG_LABEL=Slim LLVM ${LLVM_VER}" >> $GITHUB_ENV
          echo "ZIP_PREFIX=SlimLLVM" >> $GITHUB_ENV

      - name: Setup Alchemist-LLVM toolchain
        if: ${{ inputs.compiler == 'alchemist' }}
        run: |
          set -e
          PREFIX="$HOME/build_toolchain"
          CLANG_DIR="$PREFIX/clang"
          mkdir -p "$PREFIX"

          git clone --depth=1 --single-branch \
            -b clang-22-LTO \
            https://gitlab.com/nekoshirro/Alchemist-LLVM.git "$CLANG_DIR"

          # Sanity check: make sure the layout is what the kernel build expects
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            [ -x "$CLANG_DIR/bin/$tool" ] || { echo "Missing $tool in $CLANG_DIR/bin"; ls "$CLANG_DIR"; exit 1; }
          done

          "$CLANG_DIR/bin/clang" --version | head -1
          "$CLANG_DIR/bin/ld.lld" --version | head -1

          echo "$CLANG_DIR/bin" >> $GITHUB_PATH
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "CLANG_LABEL=Alchemist LLVM (clang-22-LTO)" >> $GITHUB_ENV
          echo "ZIP_PREFIX=AlchemistLLVM" >> $GITHUB_ENV

      - name: Setup KernelSU (if enabled)
        if: ${{ inputs.enable_kernelsu }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/Willay24/KernelSU/master/kernel/setup.sh" | bash -s master-susfs
          DEFCONFIG_PATH="arch/arm64/configs/${{ inputs.defconfig }}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo -e "\n# KernelSU\nCONFIG_KSU=y" >> "$DEFCONFIG_PATH"
          else
            echo "Defconfig not found at $DEFCONFIG_PATH — skipping CONFIG_KSU"
          fi

      - name: Setup nomount (if enabled)
        if: ${{ inputs.enable_nomount }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/Willay24/nomount/dev/kernel/setup.sh" | bash -s dev

      - name: Setup E.V.A (if enabled)
        if: ${{ inputs.enable_eva }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/Willay24/E.V.A/main/kernel/setup.sh" | bash -s main

      - name: Setup Baseband-guard (if enabled)
        if: ${{ inputs.enable_basebandguard }}
        run: |
          set -e
          DEFCONFIG_PATH="arch/arm64/configs/${{ inputs.defconfig }}"
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo -e "\n# Baseband-guard\nCONFIG_BBG=y" >> "$DEFCONFIG_PATH"
          else
            echo "Defconfig not found at $DEFCONFIG_PATH — skipping CONFIG_BBG"
          fi
          if [ -f security/Kconfig ]; then
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          fi

      - name: Setup ReKernel
        id: rekernel_setup
        if: ${{ inputs.use_rekernel }}
        run: |
          echo "[+] Setting up ReKernel and ReKernel-X..."
          REKERNEL_DIR="${{ github.workspace }}/ReKernel"
          REKERNEL_X_DIR="${{ github.workspace }}/ReKernel_X"
          DEFCONFIG_PATH="arch/arm64/configs/${{ inputs.defconfig }}"
          git clone --filter=blob:none https://github.com/Sakion-Team/Re-Kernel "$REKERNEL_DIR"
          git clone --filter=blob:none https://github.com/myflavor/ReKernel-X "$REKERNEL_X_DIR"
          REKERNEL_TAG=$(git -C "$REKERNEL_DIR" describe --tags $(git -C "$REKERNEL_DIR" rev-list --tags -n 1)) && git -C "$REKERNEL_DIR" checkout "tags/$REKERNEL_TAG"
          REKERNEL_X_TAG=$(git -C "$REKERNEL_X_DIR" describe --tags $(git -C "$REKERNEL_X_DIR" rev-list --tags -n 1)) && git -C "$REKERNEL_X_DIR" checkout "tags/$REKERNEL_X_TAG"
          cp -r "$REKERNEL_DIR"/LKM-Source drivers/rekernel
          sed -i 's/depends on MODULES/depends on KSU/' drivers/rekernel/Kconfig
          sed -i 's/obj-m := rekernel.o/obj-$(CONFIG_REKERNEL) += rekernel.o/' drivers/rekernel/Makefile
          echo 'obj-$(CONFIG_REKERNEL) += rekernel/' >> drivers/Makefile
          grep -q "drivers/rekernel/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
          cp -r "$REKERNEL_X_DIR"/LKM-Source drivers/rekernel_x
          sed -i 's/\bstart_rekernel\b/rkx_start/g; s/\bexit_rekernel\b/rkx_exit/g; s/\bsendMessage\b/rkx_sendMessage/g; s/\bnet_uid_add\b/rkx_net_uid_add/g; s/\bnet_uid_del\b/rkx_net_uid_del/g; s/\bregister_signal\b/rkx_register_signal/g; s/\bunregister_signal\b/rkx_unregister_signal/g; s/\bregister_netfilter\b/rkx_register_netfilter/g; s/\bunregister_netfilter\b/rkx_unregister_netfilter/g; s/\bregister_binder\b/rkx_register_binder/g; s/\bunregister_binder\b/rkx_unregister_binder/g' drivers/rekernel_x/*.{c,h}
          sed -i 's/obj-m += rekernel_x.o/obj-y += rekernel_x.o/' drivers/rekernel_x/Makefile
          echo 'obj-y += rekernel_x/' >> drivers/Makefile
          sed -i 's/KERNEL_VERSION(5, 10, 0)/KERNEL_VERSION(5, 4, 0)/g' drivers/rekernel/rekernel_binder.c drivers/rekernel_x/rkx_binder.c 2>/dev/null || true
          sed -i 's/#include <linux\/uidgid.h>/#include <linux\/uidgid.h>\n#include <linux\/cred.h>\n#include <linux\/seq_file.h>/' drivers/rekernel_x/rkx.h 2>/dev/null || true
          RKX_TAG_CLEAN="v${REKERNEL_X_TAG#v}"
          echo "ccflags-y += -DREKERNEL_VERSION=\\\"$REKERNEL_TAG\\\"" >> drivers/rekernel/Makefile
          echo "ccflags-y += -DRKX_VERSION=\\\"$RKX_TAG_CLEAN\\\"" >> drivers/rekernel_x/Makefile
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo -e "\n# ReKernel\nCONFIG_REKERNEL=y\nCONFIG_REKERNEL_NETWORK=y" >> "$DEFCONFIG_PATH"
          else
            echo "Defconfig not found at $DEFCONFIG_PATH"; exit 1
          fi
          echo "rekernel_tag=$REKERNEL_TAG" >> $GITHUB_OUTPUT
          echo "rekernel_x_tag=$REKERNEL_X_TAG" >> $GITHUB_OUTPUT
          echo "REKERNEL_VERSION=$REKERNEL_TAG" >> $GITHUB_ENV
          echo "RKX_VERSION=$RKX_TAG_CLEAN" >> $GITHUB_ENV
          echo "[✓] Re:Kernel (tag $REKERNEL_TAG) and Re:Kernel-X (tag $REKERNEL_X_TAG) integrated successfully!"

      - name: Configure and build kernel
        run: |
          set -e
          echo "Compiler: $CLANG_LABEL"
          echo "Toolchain: $CLANG_DIR"
          which clang
          clang --version | head -1
          ld.lld --version | head -1

          if [ "${{ inputs.enable_kernelsu }}" = "true" ]; then
            make O=out ARCH=arm64 "${{ inputs.defconfig }}" ksu.config
          else
            make O=out ARCH=arm64 "${{ inputs.defconfig }}"
          fi

          scripts/config --file out/.config --disable COMPAT_VDSO --disable THUMB2_COMPAT_VDSO

          if [ "$USE_CCACHE" = "1" ]; then
            CC_CMD="ccache clang"
          else
            CC_CMD="clang"
          fi

          BUILD_FLAGS=(
            ARCH=arm64
            SUBARCH=arm64
            O=out
            CC="$CC_CMD"
            AR="llvm-ar"
            NM="llvm-nm"
            LD="ld.lld -S"
            OBJCOPY="llvm-objcopy"
            OBJDUMP="llvm-objdump"
            STRIP="llvm-strip"
            CLANG_TRIPLE="aarch64-linux-gnu-"
            CROSS_COMPILE="aarch64-linux-gnu-"
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
            CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
            LLVM=1
            LLVM_IAS=1
            INSTALL_MOD_STRIP=1
            KBUILD_BUILD_USER="$(git rev-parse --short HEAD | cut -c1-7)"
            KBUILD_BUILD_HOST="$(git symbolic-ref --short HEAD)"
          )

          set -o pipefail
          make -j$(nproc --all) "${BUILD_FLAGS[@]}" 2>&1 | tee build.log
          [ -f out/arch/arm64/boot/Image ] || { echo "Image not found"; exit 1; }

          if [ "${{ inputs.package_modules }}" = "true" ]; then
            make -j$(nproc --all) "${BUILD_FLAGS[@]}" modules
            if find out -name '*.ko' | grep -q .; then
              make -j$(nproc --all) "${BUILD_FLAGS[@]}" INSTALL_MOD_PATH=modules modules_install
            else
              echo "No .ko files produced (CONFIG_MODULES may be off)"
            fi
          fi

          if [ "$USE_CCACHE" = "1" ]; then
            ccache -s
          fi

      - name: Save Ccache
        if: ${{ always() && inputs.use_ccache }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Build dtb / dtb.img / dtbo.img
        run: |
          set -e
          BOOT_OUT="out/arch/arm64/boot"
          DTS_OUT="$BOOT_OUT/dts"

          mapfile -t DTB_LIST < <(find "$DTS_OUT" -name '*.dtb' | sort)
          [ ${#DTB_LIST[@]} -gt 0 ] || { echo "No .dtb files found"; exit 1; }

          cat "${DTB_LIST[@]}" > "$BOOT_OUT/dtb"
          python3 "$MKDTBOIMG" create "$BOOT_OUT/dtb.img" "${DTB_LIST[@]}"

          if [ ! -f "$BOOT_OUT/dtbo.img" ]; then
            mapfile -t DTBO_LIST < <(find "$DTS_OUT" -name '*.dtbo' | sort)
            if [ ${#DTBO_LIST[@]} -gt 0 ]; then
              python3 "$MKDTBOIMG" create "$BOOT_OUT/dtbo.img" "${DTBO_LIST[@]}" || echo "dtbo.img creation failed — continuing"
            else
              echo "No .dtbo files found — skipping dtbo.img"
            fi
          fi

          ls -lh "$BOOT_OUT"/{Image,dtb,dtb.img,dtbo.img} 2>/dev/null || true

      - name: Prepare AnyKernel3 package
        env:
          AK3_BRANCH: ${{ inputs.anykernel_branch }}
        run: |
          set -e
          git clone --depth=1 https://github.com/William24hmar/AnyKernel3.git -b "$AK3_BRANCH" anykernel
          echo "AnyKernel3: $AK3_BRANCH @ $(git -C anykernel log -1 --format='%h %s')"
          BOOT_OUT="out/arch/arm64/boot"

          # Show the toolchain that was actually used in the flash screen
          sed -i "s|^kernel.compiler=.*|kernel.compiler=${CLANG_LABEL}|" anykernel/anykernel.sh

          # Warn if the flash script expects files this branch does not have
          if grep -q rollback_if_abort_flag anykernel/anykernel.sh; then
            for f in _restore_anykernel.sh _rollback_anykernel.sh tools/7za tools/keycheck tools/snapshotupdater_static tools/vbmeta-disable-verification; do
              [ -e "anykernel/$f" ] || echo "::warning::anykernel.sh expects $f but it is missing on branch $AK3_BRANCH"
            done
            grep -q rollback_if_abort_flag anykernel/META-INF/com/google/android/update-binary || \
              echo "::warning::update-binary on $AK3_BRANCH has no rollback hook, so the rollback flag in anykernel.sh will do nothing"
          fi

          # Image and dtbo.img are always packed (the dtb lives in vendor_boot and is not flashed)
          for f in Image dtbo.img; do
            [ -f "$BOOT_OUT/$f" ] || { echo "::error::$f not found in $BOOT_OUT"; exit 1; }
            cp "$BOOT_OUT/$f" anykernel/
          done

      - name: Package kernel modules for AnyKernel3
        if: ${{ inputs.package_modules }}
        run: |
          set -e
          [ -d out/modules ] || { echo "out/modules not present — nothing to package"; exit 0; }

          MOD_DEST="anykernel/modules/vendor/lib/modules"
          mkdir -p "$MOD_DEST"

          KO_FILES=()
          while IFS= read -r -d '' f; do KO_FILES+=("$f"); done \
            < <(find out -path out/modules -prune -o -name '*.ko' -print0)
          while IFS= read -r -d '' f; do KO_FILES+=("$f"); done \
            < <(find . -maxdepth 6 -name 'nomount.ko' -not -path './out/*' -print0)

          [ ${#KO_FILES[@]} -gt 0 ] || { echo "No .ko files found — skipping"; exit 0; }

          declare -A seen=()
          for f in "${KO_FILES[@]}"; do
            base=$(basename "$f")
            [ -n "${seen[$base]:-}" ] && continue
            cp "$f" "$MOD_DEST/$base"
            seen[$base]=1
          done
          echo "Packed ${#seen[@]} module(s)"

          MODSRC_DIR=$(find out/modules/lib/modules -maxdepth 1 -mindepth 1 -type d | head -n1)
          if [ -n "$MODSRC_DIR" ]; then
            for f in "$MODSRC_DIR"/modules.*; do
              [ -f "$f" ] && cp "$f" "$MOD_DEST/"
            done
            [ -f "$MODSRC_DIR/modules.order" ] && cp "$MODSRC_DIR/modules.order" "$MOD_DEST/modules.load"
          fi

          if [ -f "$MOD_DEST/modules.dep" ]; then
            sed -i 's/\(kernel\/[^: ]*\/\)\([^: ]*\.ko\)/\/vendor\/lib\/modules\/\2/g' "$MOD_DEST/modules.dep"
          fi
          if [ -f "$MOD_DEST/modules.load" ]; then
            sed -i 's/.*\///g' "$MOD_DEST/modules.load"
          fi

      - name: Compress payload with 7za (if enabled)
        if: ${{ inputs.pack_7z }}
        run: |
          set -e
          cd anykernel
          mkdir -p _dtb
          for f in dtb dtb.img dtbo.img; do
            [ -f "$f" ] && mv "$f" _dtb/
          done

          7za a -t7z -mx=9 -bd Image.7z ./Image > /dev/null && rm -f Image
          (cd _dtb && 7za a -t7z -mx=9 -bd ../_dtb.7z './*' > /dev/null) && rm -rf _dtb

          # modules are only compressed when the module option is on
          if [ "${{ inputs.package_modules }}" = "true" ] && [ -d modules ]; then
            (cd modules && 7za a -t7z -mx=9 -mf=off -bd ../_modules.7z './*' > /dev/null) && rm -rf modules
          fi
          ls -lh *.7z

      - name: Create flashable ZIP
        run: |
          SAFE_TAG="${{ inputs.build_tag }}"
          SAFE_TAG="${SAFE_TAG// /-}"
          SAFE_TAG="${SAFE_TAG//\//-}"
          [ "${{ inputs.enable_basebandguard }}" = "true" ] && SAFE_TAG="${SAFE_TAG}-BBG"
          [ "${{ inputs.enable_nomount }}" = "true" ] && SAFE_TAG="${SAFE_TAG}-nomount"
          [ "${{ inputs.enable_eva }}" = "true" ] && SAFE_TAG="${SAFE_TAG}-EVA"
          [ "${{ inputs.use_rekernel }}" = "true" ] && SAFE_TAG="${SAFE_TAG}-ReKernel"

          ZIP_NAME="${ZIP_PREFIX}-${SAFE_TAG}-$(date +%Y%m%d-%H%M).zip"
          if [ "${{ inputs.pack_7z }}" = "true" ]; then
            # .7z archives are already compressed, so store them as-is
            (cd anykernel && zip -r9 "../$ZIP_NAME" . -x "*.git*" -x "README.md" -x "*.7z" && zip -0 "../$ZIP_NAME" ./*.7z)
          else
            (cd anykernel && zip -r9 "../$ZIP_NAME" . -x "*.git*" -x "README.md")
          fi
          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV
          echo "Zip created: $ZIP_NAME ($(du -sh "$ZIP_NAME" | cut -f1))"

      - name: Generate signing keystore
        if: ${{ inputs.enable_signing }}
        run: |
          set -e
          SIGNER_DIR="$HOME/.gf"
          KEYSTORE="$SIGNER_DIR/keystore.p12"
          [ -f "$KEYSTORE" ] && exit 0

          rm -rf "$SIGNER_DIR"
          mkdir -p "$SIGNER_DIR" && chmod 700 "$SIGNER_DIR"
          PASS=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 18)
          UNIQUE_ID=$(date +%Y%m%d_%H%M%S)
          KEYALIAS="tenzoKey_${UNIQUE_ID}"
          echo "$PASS"     > "$SIGNER_DIR/.store_pass"
          echo "$KEYALIAS" > "$SIGNER_DIR/.alias"
          chmod 600 "$SIGNER_DIR/.store_pass" "$SIGNER_DIR/.alias"

          openssl genrsa -out "$SIGNER_DIR/rootCA.key" 4096
          openssl req -x509 -new -nodes \
            -key "$SIGNER_DIR/rootCA.key" -sha256 -days 9125 \
            -out "$SIGNER_DIR/rootCA.pem" \
            -subj "/CN=Tenzo Root CA/O=Madara273/C=UA"

          openssl genrsa -out "$SIGNER_DIR/tenzo.key" 4096
          openssl req -new \
            -key "$SIGNER_DIR/tenzo.key" \
            -out "$SIGNER_DIR/tenzo.csr" \
            -subj "/CN=Tenzo, OU=Root, O=Madara273, L=UA, ST=Ukraine, C=UA"
          openssl x509 -req \
            -in "$SIGNER_DIR/tenzo.csr" \
            -CA "$SIGNER_DIR/rootCA.pem" \
            -CAkey "$SIGNER_DIR/rootCA.key" \
            -CAcreateserial \
            -out "$SIGNER_DIR/tenzo.crt" \
            -sha256 -days 365

          openssl pkcs12 -export \
            -inkey "$SIGNER_DIR/tenzo.key" \
            -in "$SIGNER_DIR/tenzo.crt" \
            -certfile "$SIGNER_DIR/rootCA.pem" \
            -out "$SIGNER_DIR/tenzo.p12" \
            -password pass:"$PASS" \
            -name "$KEYALIAS"
          keytool -importkeystore \
            -srckeystore "$SIGNER_DIR/tenzo.p12" \
            -srcstoretype PKCS12 -srcstorepass "$PASS" \
            -destkeystore "$KEYSTORE" \
            -deststoretype PKCS12 -deststorepass "$PASS" \
            -alias "$KEYALIAS" -noprompt
          keytool -importcert -trustcacerts \
            -alias "rootCA_${UNIQUE_ID}" \
            -file "$SIGNER_DIR/rootCA.pem" \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" -noprompt

          sudo keytool -delete -cacerts -storepass changeit -alias tenzoRoot -noprompt >/dev/null 2>&1 || true
          sudo keytool -importcert \
            -alias tenzoRoot \
            -file "$SIGNER_DIR/rootCA.pem" \
            -cacerts -storepass changeit -noprompt

          echo "SIGNER_DIR=$SIGNER_DIR" >> $GITHUB_ENV

      - name: Sign flashable ZIP
        if: ${{ inputs.enable_signing }}
        run: |
          set -e
          SIGNER_DIR="$HOME/.gf"
          KEYSTORE="$SIGNER_DIR/keystore.p12"
          PASS=$(cat "$SIGNER_DIR/.store_pass")
          KEYALIAS=$(cat "$SIGNER_DIR/.alias")
          SIGNED="${ZIP_FILE%.zip}-signed.zip"

          cp "$ZIP_FILE" "$SIGNED"
          OUTPUT=$(jarsigner \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -tsa http://timestamp.digicert.com \
            "$SIGNED" "$KEYALIAS" 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "jar signed." || { echo "Signing failed"; exit 1; }

          echo "ZIP_FILE=$SIGNED" >> $GITHUB_ENV

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_PREFIX }}-Kernel-${{ github.run_number }}
          path: ${{ env.ZIP_FILE }}

      - name: Push ZIP to Telegram
        if: success()
        run: |
          MD5CHECK=$(md5sum "$ZIP_FILE" | cut -d' ' -f1)
          SIZE=$(du -sh "$ZIP_FILE" | cut -f1)
          CAPTION="✅ Build Successful
          Branch: ${{ inputs.kernel_branch }}
          Tag: ${{ inputs.build_tag }}
          KernelSU: ${{ inputs.enable_kernelsu }}
          ReKernel: ${{ inputs.use_rekernel }}
          Signed: ${{ inputs.enable_signing }}
          Compiler: ${{ env.CLANG_LABEL }}
          Size: $SIZE
          MD5: $MD5CHECK"
          curl -s -F document=@"$ZIP_FILE" "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F caption="$CAPTION"

      - name: Notify Telegram - build failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="html" \
            -d disable_web_page_preview=true \
            -d text="❌ <b>Build Failed</b>%0A<b>Compiler:</b> <code>${{ inputs.compiler }}</code>%0A<b>Branch:</b> <code>${{ inputs.kernel_branch }}</code>%0A<b>Tag:</b> <code>${{ inputs.build_tag }}</code>%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f build.log ]; then
            curl -s -F document=@build.log "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F caption="Build log for failed run (${{ github.run_id }})"
          fi