name: Build Kernel with Slim LLVM

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch to build (e.g., LosKernel-23)'
        required: true
        default: 'Staging-Kernel'
      defconfig:
        description: 'Defconfig name (without path)'
        required: true
        default: 'vendor/lahaina-qgki_defconfig'
      enable_kernelsu_next:
        description: 'Enable KernelSU Next (yes/no)'
        default: 'no'
      enable_nomount:
        description: 'Integrate nomount (yes/no)'
        default: 'no'
      enable_eva:
        description: 'Integrate E.V.A (yes/no)'
        default: 'no'
      enable_basebandguard:
        description: 'Integrate Baseband-guard LSM (yes/no)'
        default: 'no'
      package_modules:
        description: 'Pack .ko modules into the zip (yes/no)'
        default: 'yes'
      build_tag:
        description: 'Build tag for ZIP name (e.g., Test/Perf/Normal)'
        default: 'Normal'
      enable_signing:
        description: 'Sign the ZIP with Tenzo keystore (yes/no)'
        default: 'no'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_branch }}

      - name: Notify Telegram - build start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="html" \
            -d disable_web_page_preview=true \
            -d text="🔨 <b>Kernel Build Triggered</b>%0A<b>Branch:</b> <code>${{ inputs.kernel_branch }}</code>%0A<b>Defconfig:</b> <code>${{ inputs.defconfig }}</code>%0A<b>KernelSU Next:</b> <code>${{ inputs.enable_kernelsu_next }}</code>%0A<b>Signing:</b> <code>${{ inputs.enable_signing }}</code>%0A<b>Tag:</b> <code>${{ inputs.build_tag }}</code>%0A<b>Triggered by:</b> <code>${{ github.actor }}</code>"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev make libelf-dev lz4 cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential device-tree-compiler \
            python3 python3-pip zip git ccache wget xz-utils zstd aria2 \
            default-jre openjdk-21-jdk

      - name: Install mkdtboimg
        run: |
          set -e
          MKDTBOIMG="/usr/local/bin/mkdtboimg.py"
          if [ -f scripts/mkdtboimg.py ]; then
            sudo cp scripts/mkdtboimg.py "$MKDTBOIMG"
          else
            wget -q "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/master/utils/src/mkdtboimg.py?format=TEXT" -O mkdtboimg_b64.txt
            base64 -d mkdtboimg_b64.txt | sudo tee "$MKDTBOIMG" > /dev/null
            rm mkdtboimg_b64.txt
          fi
          sudo chmod +x "$MKDTBOIMG"
          python3 "$MKDTBOIMG" --help > /dev/null
          echo "MKDTBOIMG=$MKDTBOIMG" >> $GITHUB_ENV

      - name: Setup Slim LLVM toolchain
        run: |
          set -e
          PREFIX="$HOME/build_toolchain"
          CLANG="llvm-23.1.1-x86_64"
          mkdir -p "$PREFIX"
          cd "$PREFIX"
          aria2c -q "https://mirrors.edge.kernel.org/pub/tools/llvm/files/$CLANG.tar.xz"
          tar -xJf "$CLANG.tar.xz"

          CLANG_DIR="$PREFIX/$CLANG"
          "$CLANG_DIR/bin/clang" --version | head -1
          "$CLANG_DIR/bin/ld.lld" --version | head -1

          echo "$CLANG_DIR/bin" >> $GITHUB_PATH
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "CLANG_LABEL=Slim LLVM 23.1.1" >> $GITHUB_ENV

      - name: Setup KernelSU (if enabled)
        if: ${{ inputs.enable_kernelsu_next == 'yes' }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          rm -rf KernelSU
          git clone -b master-susfs https://github.com/William24hmar/KernelSU.git KernelSU
          DEFCONFIG_PATH="arch/arm64/configs/${{ inputs.defconfig }}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo -e "\n# KernelSU\nCONFIG_KSU=y" >> "$DEFCONFIG_PATH"
          else
            echo "Defconfig not found at $DEFCONFIG_PATH — skipping CONFIG_KSU"
          fi

      - name: Setup nomount (if enabled)
        if: ${{ inputs.enable_nomount == 'yes' }}
        run: |
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev
          rm -rf NoMount
          git clone -b dev https://github.com/Willay24/nomount.git NoMount

      - name: Setup E.V.A (if enabled)
        if: ${{ inputs.enable_eva == 'yes' }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/Willay24/E.V.A/main/kernel/setup.sh" | bash -s main

      - name: Setup Baseband-guard (if enabled)
        if: ${{ inputs.enable_basebandguard == 'yes' }}
        run: |
          set -e
          DEFCONFIG_PATH="arch/arm64/configs/${{ inputs.defconfig }}"
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo -e "\n# Baseband-guard\nCONFIG_BBG=y" >> "$DEFCONFIG_PATH"
          else
            echo "Defconfig not found at $DEFCONFIG_PATH — skipping CONFIG_BBG"
          fi
          if [ -f security/Kconfig ]; then
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          fi

      - name: Configure and build kernel
        run: |
          set -e
          echo "Toolchain: $CLANG_DIR"
          clang --version | head -1
          ld.lld --version | head -1

          if [ "${{ inputs.enable_kernelsu_next }}" = "yes" ]; then
            make O=out ARCH=arm64 "${{ inputs.defconfig }}" ksu.config
          else
            make O=out ARCH=arm64 "${{ inputs.defconfig }}"
          fi

          scripts/config --file out/.config --disable COMPAT_VDSO --disable THUMB2_COMPAT_VDSO

          BUILD_FLAGS=(
            ARCH=arm64
            SUBARCH=arm64
            O=out
            CC="ccache clang"
            AR="llvm-ar"
            NM="llvm-nm"
            LD="ld.lld -S"
            OBJCOPY="llvm-objcopy"
            OBJDUMP="llvm-objdump"
            STRIP="llvm-strip"
            CLANG_TRIPLE="aarch64-linux-gnu-"
            CROSS_COMPILE="aarch64-linux-gnu-"
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
            CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
            LLVM=1
            LLVM_IAS=1
            INSTALL_MOD_STRIP=1
            KBUILD_BUILD_USER="$(git rev-parse --short HEAD | cut -c1-7)"
            KBUILD_BUILD_HOST="$(git symbolic-ref --short HEAD)"
          )

          set -o pipefail
          make -j$(nproc --all) "${BUILD_FLAGS[@]}" 2>&1 | tee build.log
          [ -f out/arch/arm64/boot/Image ] || { echo "Image not found"; exit 1; }

          if [ "${{ inputs.package_modules }}" = "yes" ]; then
            make -j$(nproc --all) "${BUILD_FLAGS[@]}" modules
            if find out -name '*.ko' | grep -q .; then
              make -j$(nproc --all) "${BUILD_FLAGS[@]}" INSTALL_MOD_PATH=modules modules_install
            else
              echo "No .ko files produced (CONFIG_MODULES may be off)"
            fi
          fi

          ccache -s

      - name: Build dtb / dtb.img / dtbo.img
        run: |
          set -e
          BOOT_OUT="out/arch/arm64/boot"
          DTS_OUT="$BOOT_OUT/dts"

          mapfile -t DTB_LIST < <(find "$DTS_OUT" -name '*.dtb' | sort)
          [ ${#DTB_LIST[@]} -gt 0 ] || { echo "No .dtb files found"; exit 1; }

          cat "${DTB_LIST[@]}" > "$BOOT_OUT/dtb"
          python3 "$MKDTBOIMG" create "$BOOT_OUT/dtb.img" "${DTB_LIST[@]}"

          if [ ! -f "$BOOT_OUT/dtbo.img" ]; then
            mapfile -t DTBO_LIST < <(find "$DTS_OUT" -name '*.dtbo' | sort)
            if [ ${#DTBO_LIST[@]} -gt 0 ]; then
              python3 "$MKDTBOIMG" create "$BOOT_OUT/dtbo.img" "${DTBO_LIST[@]}" || echo "dtbo.img creation failed — continuing"
            else
              echo "No .dtbo files found — skipping dtbo.img"
            fi
          fi

          ls -lh "$BOOT_OUT"/{Image,dtb,dtb.img,dtbo.img} 2>/dev/null || true

      - name: Prepare AnyKernel3 package
        run: |
          git clone --depth=1 https://github.com/William24hmar/AnyKernel3.git -b master anykernel
          BOOT_OUT="out/arch/arm64/boot"
          cp "$BOOT_OUT/Image" anykernel/
          for f in dtb dtb.img dtbo.img; do
            [ -f "$BOOT_OUT/$f" ] && cp "$BOOT_OUT/$f" anykernel/ || echo "$f not found"
          done

      - name: Package kernel modules for AnyKernel3
        if: ${{ inputs.package_modules == 'yes' }}
        run: |
          set -e
          [ -d out/modules ] || { echo "out/modules not present — nothing to package"; exit 0; }

          MOD_DEST="anykernel/modules/vendor/lib/modules"
          mkdir -p "$MOD_DEST"

          KO_FILES=()
          while IFS= read -r -d '' f; do KO_FILES+=("$f"); done \
            < <(find out -path out/modules -prune -o -name '*.ko' -print0)
          while IFS= read -r -d '' f; do KO_FILES+=("$f"); done \
            < <(find . -maxdepth 6 -name 'nomount.ko' -not -path './out/*' -print0)

          [ ${#KO_FILES[@]} -gt 0 ] || { echo "No .ko files found — skipping"; exit 0; }

          declare -A seen=()
          for f in "${KO_FILES[@]}"; do
            base=$(basename "$f")
            [ -n "${seen[$base]:-}" ] && continue
            cp "$f" "$MOD_DEST/$base"
            seen[$base]=1
          done
          echo "Packed ${#seen[@]} module(s)"

          MODSRC_DIR=$(find out/modules/lib/modules -maxdepth 1 -mindepth 1 -type d | head -n1)
          if [ -n "$MODSRC_DIR" ]; then
            for f in "$MODSRC_DIR"/modules.*; do
              [ -f "$f" ] && cp "$f" "$MOD_DEST/"
            done
            [ -f "$MODSRC_DIR/modules.order" ] && cp "$MODSRC_DIR/modules.order" "$MOD_DEST/modules.load"
          fi

          if [ -f "$MOD_DEST/modules.dep" ]; then
            sed -i 's/\(kernel\/[^: ]*\/\)\([^: ]*\.ko\)/\/vendor\/lib\/modules\/\2/g' "$MOD_DEST/modules.dep"
          fi
          if [ -f "$MOD_DEST/modules.load" ]; then
            sed -i 's/.*\///g' "$MOD_DEST/modules.load"
          fi

      - name: Create flashable ZIP
        run: |
          SAFE_TAG="${{ inputs.build_tag }}"
          SAFE_TAG="${SAFE_TAG// /-}"
          SAFE_TAG="${SAFE_TAG//\//-}"
          [ "${{ inputs.enable_basebandguard }}" = "yes" ] && SAFE_TAG="${SAFE_TAG}-BBG"
          [ "${{ inputs.enable_nomount }}" = "yes" ] && SAFE_TAG="${SAFE_TAG}-nomount"
          [ "${{ inputs.enable_eva }}" = "yes" ] && SAFE_TAG="${SAFE_TAG}-EVA"

          ZIP_NAME="SlimLLVM-${SAFE_TAG}-$(date +%Y%m%d-%H%M).zip"
          (cd anykernel && zip -r9 "../$ZIP_NAME" . -x "*.git*" -x "README.md")
          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV
          echo "Zip created: $ZIP_NAME ($(du -sh "$ZIP_NAME" | cut -f1))"

      - name: Generate signing keystore
        if: ${{ inputs.enable_signing == 'yes' }}
        run: |
          set -e
          SIGNER_DIR="$HOME/.gf"
          KEYSTORE="$SIGNER_DIR/keystore.p12"
          [ -f "$KEYSTORE" ] && exit 0

          rm -rf "$SIGNER_DIR"
          mkdir -p "$SIGNER_DIR" && chmod 700 "$SIGNER_DIR"
          PASS=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 18)
          UNIQUE_ID=$(date +%Y%m%d_%H%M%S)
          KEYALIAS="tenzoKey_${UNIQUE_ID}"
          echo "$PASS"     > "$SIGNER_DIR/.store_pass"
          echo "$KEYALIAS" > "$SIGNER_DIR/.alias"
          chmod 600 "$SIGNER_DIR/.store_pass" "$SIGNER_DIR/.alias"

          openssl genrsa -out "$SIGNER_DIR/rootCA.key" 4096
          openssl req -x509 -new -nodes \
            -key "$SIGNER_DIR/rootCA.key" -sha256 -days 9125 \
            -out "$SIGNER_DIR/rootCA.pem" \
            -subj "/CN=Tenzo Root CA/O=Madara273/C=UA"

          openssl genrsa -out "$SIGNER_DIR/tenzo.key" 4096
          openssl req -new \
            -key "$SIGNER_DIR/tenzo.key" \
            -out "$SIGNER_DIR/tenzo.csr" \
            -subj "/CN=Tenzo, OU=Root, O=Madara273, L=UA, ST=Ukraine, C=UA"
          openssl x509 -req \
            -in "$SIGNER_DIR/tenzo.csr" \
            -CA "$SIGNER_DIR/rootCA.pem" \
            -CAkey "$SIGNER_DIR/rootCA.key" \
            -CAcreateserial \
            -out "$SIGNER_DIR/tenzo.crt" \
            -sha256 -days 365

          openssl pkcs12 -export \
            -inkey "$SIGNER_DIR/tenzo.key" \
            -in "$SIGNER_DIR/tenzo.crt" \
            -certfile "$SIGNER_DIR/rootCA.pem" \
            -out "$SIGNER_DIR/tenzo.p12" \
            -password pass:"$PASS" \
            -name "$KEYALIAS"
          keytool -importkeystore \
            -srckeystore "$SIGNER_DIR/tenzo.p12" \
            -srcstoretype PKCS12 -srcstorepass "$PASS" \
            -destkeystore "$KEYSTORE" \
            -deststoretype PKCS12 -deststorepass "$PASS" \
            -alias "$KEYALIAS" -noprompt
          keytool -importcert -trustcacerts \
            -alias "rootCA_${UNIQUE_ID}" \
            -file "$SIGNER_DIR/rootCA.pem" \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" -noprompt

          sudo keytool -delete -cacerts -storepass changeit -alias tenzoRoot -noprompt >/dev/null 2>&1 || true
          sudo keytool -importcert \
            -alias tenzoRoot \
            -file "$SIGNER_DIR/rootCA.pem" \
            -cacerts -storepass changeit -noprompt

          echo "SIGNER_DIR=$SIGNER_DIR" >> $GITHUB_ENV

      - name: Sign flashable ZIP
        if: ${{ inputs.enable_signing == 'yes' }}
        run: |
          set -e
          SIGNER_DIR="$HOME/.gf"
          KEYSTORE="$SIGNER_DIR/keystore.p12"
          PASS=$(cat "$SIGNER_DIR/.store_pass")
          KEYALIAS=$(cat "$SIGNER_DIR/.alias")
          SIGNED="${ZIP_FILE%.zip}-signed.zip"

          cp "$ZIP_FILE" "$SIGNED"
          OUTPUT=$(jarsigner \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -tsa http://timestamp.digicert.com \
            "$SIGNED" "$KEYALIAS" 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "jar signed." || { echo "Signing failed"; exit 1; }

          echo "ZIP_FILE=$SIGNED" >> $GITHUB_ENV

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SlimLLVM-Kernel-${{ github.run_number }}
          path: ${{ env.ZIP_FILE }}

      - name: Push ZIP to Telegram
        if: success()
        run: |
          MD5CHECK=$(md5sum "$ZIP_FILE" | cut -d' ' -f1)
          SIZE=$(du -sh "$ZIP_FILE" | cut -f1)
          CAPTION="✅ Build Successful
          Branch: ${{ inputs.kernel_branch }}
          Tag: ${{ inputs.build_tag }}
          KernelSU Next: ${{ inputs.enable_kernelsu_next }}
          Signed: ${{ inputs.enable_signing }}
          Compiler: ${{ env.CLANG_LABEL }}
          Size: $SIZE
          MD5: $MD5CHECK"
          curl -s -F document=@"$ZIP_FILE" "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F caption="$CAPTION"

      - name: Notify Telegram - build failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="html" \
            -d disable_web_page_preview=true \
            -d text="❌ <b>Build Failed</b>%0A<b>Branch:</b> <code>${{ inputs.kernel_branch }}</code>%0A<b>Tag:</b> <code>${{ inputs.build_tag }}</code>%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f build.log ]; then
            curl -s -F document=@build.log "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F caption="Build log for failed run (${{ github.run_id }})"
          fi