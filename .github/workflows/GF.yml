name: Build Kernel with Greenforce Clang

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch to build (e.g., LosKernel-23)'
        required: true
        default: 'Staging-Kernel'
      defconfig:
        description: 'Defconfig name (without path)'
        required: true
        default: 'vendor/lahaina-qgki_defconfig'
      enable_kernelsu_next:
        description: 'Enable KernelSU Next (yes/no)'
        required: false
        default: 'no'
      build_tag:
        description: 'Build tag for ZIP name (e.g., Test/Perf/Normal)'
        required: false
        default: 'Normal'
      enable_signing:
        description: 'Sign the flashable ZIP with Tenzo keystore (yes/no)'
        required: false
        default: 'no'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.kernel_branch }}

      # -------------------------------------------------------------------
      # Telegram: build-start notification. Fires as soon as we've checked
      # out the source, so you know a build kicked off even if it fails
      # in the very first setup step.
      # -------------------------------------------------------------------
      - name: Notify Telegram - build start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="html" \
            -d disable_web_page_preview=true \
            -d text="🔨 <b>Kernel Build Triggered</b>%0A<b>Branch:</b> <code>${{ github.event.inputs.kernel_branch }}</code>%0A<b>Defconfig:</b> <code>${{ github.event.inputs.defconfig }}</code>%0A<b>KernelSU Next:</b> <code>${{ github.event.inputs.enable_kernelsu_next }}</code>%0A<b>Signing:</b> <code>${{ github.event.inputs.enable_signing }}</code>%0A<b>Tag:</b> <code>${{ github.event.inputs.build_tag }}</code>%0A<b>Triggered by:</b> <code>${{ github.actor }}</code>"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev make libelf-dev lz4 cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential clang lld llvm device-tree-compiler \
            python3 python3-pip zip git ccache wget xz-utils zstd \
            default-jre openjdk-21-jdk
      # -------------------------------------------------------------------
      # Use mkdtboimg.py from the kernel tree if present at
      # scripts/mkdtboimg.py — only fall back to downloading from AOSP
      # googlesource when it is missing.
      # -------------------------------------------------------------------
      - name: Install mkdtboimg
        run: |
          set -e
          MKDTBOIMG="/usr/local/bin/mkdtboimg.py"
          if [ -f "scripts/mkdtboimg.py" ]; then
            echo "✅ Found mkdtboimg.py in kernel tree (scripts/mkdtboimg.py) — using it"
            cp scripts/mkdtboimg.py "$MKDTBOIMG"
            chmod +x "$MKDTBOIMG"
          else
            echo "⚠️  scripts/mkdtboimg.py not found in kernel tree"
            echo "📥 Downloading mkdtboimg.py from AOSP googlesource..."
            wget -q \
              "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/master/utils/src/mkdtboimg.py?format=TEXT" \
              -O mkdtboimg_b64.txt
            base64 -d mkdtboimg_b64.txt > "$MKDTBOIMG"
            chmod +x "$MKDTBOIMG"
            rm mkdtboimg_b64.txt
          fi
          python3 "$MKDTBOIMG" --help > /dev/null 2>&1 \
            && echo "✅ mkdtboimg.py verified successfully" \
            || { echo "❌ mkdtboimg.py verification failed"; exit 1; }
          echo "MKDTBOIMG=$MKDTBOIMG" >> $GITHUB_ENV
      # -------------------------------------------------------------------
      # Always fetch the latest Greenforce Clang release via the official
      # get_clang.sh installer (no pinned version/URL to maintain).
      # Installs into $GITHUB_WORKSPACE/greenforce-clang and exports its
      # bin dir onto PATH for this step and all subsequent steps.
      # -------------------------------------------------------------------
      - name: Setup Greenforce Clang
        run: |
          set -e
          echo "📥 Running Greenforce Clang setup script..."
          bash <(wget -qO- https://raw.githubusercontent.com/greenforce-project/greenforce_clang/refs/heads/main/get_clang.sh)
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/greenforce-clang"
          if [ ! -x "$TOOLCHAIN_DIR/bin/clang" ]; then
            echo "❌ clang binary not found in $TOOLCHAIN_DIR/bin/"
            exit 1
          fi
          CLANG_VER=$("$TOOLCHAIN_DIR/bin/clang" --version | head -1)
          echo "✅ Greenforce Clang installed successfully"
          echo "   Version: $CLANG_VER"
          # ── Export toolchain path for all later steps ───────────────────
          echo "GF_PATH=$TOOLCHAIN_DIR"       >> $GITHUB_ENV
          echo "$TOOLCHAIN_DIR/bin"           >> $GITHUB_PATH
          echo "CLANG_LABEL=Greenforce Clang" >> $GITHUB_ENV
      # -------------------------------------------------------------------
      # KernelSU setup:
      #   1. Run the official tiann KernelSU setup.sh
      #   2. Remove the KernelSU folder it created
      #   3. Clone backslashxx's KernelSU fork (master branch)
      # -------------------------------------------------------------------
      - name: Setup KernelSU (if enabled)
        if: ${{ github.event.inputs.enable_kernelsu_next == 'yes' }}
        run: |
          echo "🔧 Enabling KernelSU..."
          # Step 1: Run the official tiann KernelSU setup script
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          # Step 2: Remove the KernelSU folder created by setup
          rm -rf KernelSU
          # Step 3: Clone backslashxx's KernelSU fork (master branch)
          git clone -b master-susfs https://github.com/William24hmar/KernelSU.git KernelSU
          # Step 4: Inject CONFIG_KSU=y into defconfig
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.defconfig }}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "✅ Adding CONFIG_KSU=y to defconfig"
            echo -e "\n# KernelSU\nCONFIG_KSU=y" >> "$DEFCONFIG_PATH"
          else
            echo "⚠️  Defconfig not found at $DEFCONFIG_PATH — skipping CONFIG_KSU injection"
          fi
      # -------------------------------------------------------------------
      # Configure + build using IDENTICAL toolchain flags in both make
      # invocations. If CC/LLVM differ between the defconfig step and the
      # build step, clang exposes Kconfig symbols gcc doesn't (POLLY_CLANG,
      # THUMB2_COMPAT_VDSO, LTO_CLANG...) and Kconfig is forced to "Restart
      # config" mid-build, going interactive with no TTY to answer it.
      # Keeping the flags identical means all resolution happens once,
      # non-interactively, right here.
      #
      # COMPAT_VDSO is force-disabled: its Kconfig default is Y, but
      # Greenforce Clang ships no thumbv7-unknown-linux-gnueabi target, so
      # leaving it on (or accepting the default via a piped "yes") fails
      # the build on arch/arm64/kernel/vdso32/note.o. This mirrors the "n"
      # answer given manually — everything else can safely use the
      # defconfig/Kconfig defaults.
      # ksu.config is only merged in when KernelSU Next is enabled.
      #
      # KBUILD_BUILD_USER / KBUILD_BUILD_HOST are overridden here so the
      # kernel's build string doesn't leak the GitHub Actions runner's
      # generated username/hostname (e.g. runner@fv-az123-456).
      # -------------------------------------------------------------------
      - name: Configure and build kernel
        run: |
          set -e
          export KBUILD_BUILD_USER="willay"
          export KBUILD_BUILD_HOST="GNU"
          MAKE_ARGS="O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf \
            STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu-"
          DEFCONFIG="${{ github.event.inputs.defconfig }}"
          if [ "${{ github.event.inputs.enable_kernelsu_next }}" = "yes" ]; then
            echo "⚙️  Configuring kernel ($DEFCONFIG + ksu.config)..."
            make $MAKE_ARGS "$DEFCONFIG" ksu.config
          else
            echo "⚙️  Configuring kernel ($DEFCONFIG)..."
            make $MAKE_ARGS "$DEFCONFIG"
          fi
          echo "🔧 Disabling COMPAT_VDSO (unsupported thumbv7 target)..."
          scripts/config --file out/.config --disable COMPAT_VDSO --disable THUMB2_COMPAT_VDSO
          make $MAKE_ARGS olddefconfig
          echo "🔨 Building kernel Image and dtbs..."
          set -o pipefail
          make -j$(nproc --all) $MAKE_ARGS Image dtbs 2>&1 | tee build.log
          echo "✅ Kernel build completed"
      - name: Verify Image was produced
        run: |
          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✅ Image found — proceeding to dtb/dtbo packaging"
          else
            echo "❌ Image not found — kernel build truly failed"
            exit 1
          fi
      - name: Build dtb / dtb.img / dtbo.img
        run: |
          set -e
          BOOT_OUT="out/arch/arm64/boot"
          DTS_OUT="$BOOT_OUT/dts"
          echo "🔗 Merging .dtb files into dtb blob..."
          if find "$DTS_OUT" -name '*.dtb' 2>/dev/null | grep -q .; then
            find "$DTS_OUT" -name '*.dtb' -exec cat {} + > "$BOOT_OUT/dtb"
            echo "✅ dtb blob created ($(wc -c < "$BOOT_OUT/dtb") bytes)"
          else
            echo "❌ No .dtb files found — cannot create dtb blob"
            exit 1
          fi
          echo "📦 Creating dtb.img..."
          mapfile -t DTB_LIST < <(find "$DTS_OUT" -name '*.dtb' | sort)
          if [ ${#DTB_LIST[@]} -eq 0 ]; then
            echo "❌ No .dtb files to pack into dtb.img"
            exit 1
          fi
          python3 "$MKDTBOIMG" create "$BOOT_OUT/dtb.img" "${DTB_LIST[@]}" \
            && echo "✅ dtb.img created (${#DTB_LIST[@]} dtb entries)" \
            || { echo "❌ Failed to create dtb.img"; exit 1; }
          if [ -f "$BOOT_OUT/dtbo.img" ]; then
            echo "✅ dtbo.img already present (built by kernel)"
          elif find "$DTS_OUT" -name '*.dtbo' 2>/dev/null | grep -q .; then
            echo "📦 Creating dtbo.img from .dtbo overlay files..."
            mapfile -t DTBO_LIST < <(find "$DTS_OUT" -name '*.dtbo' | sort)
            python3 "$MKDTBOIMG" create "$BOOT_OUT/dtbo.img" "${DTBO_LIST[@]}" \
              && echo "✅ dtbo.img created (${#DTBO_LIST[@]} dtbo entries)" \
              || echo "⚠️  Failed to create dtbo.img — continuing anyway"
          else
            echo "⚠️  No .dtbo files and no pre-built dtbo.img found"
            echo "    (CONFIG_BUILD_ARM64_DT_OVERLAY may not be set in your defconfig)"
          fi
          echo ""
          echo "── Boot artifacts ──────────────────────"
          ls -lh \
            "$BOOT_OUT/Image" \
            "$BOOT_OUT/dtb" \
            "$BOOT_OUT/dtb.img" \
            "$BOOT_OUT/dtbo.img" 2>/dev/null || true
          echo "────────────────────────────────────────"
      - name: Prepare AnyKernel3 package
        run: |
          git clone --depth=1 https://github.com/William24hmar/AnyKernel3.git -b master anykernel
          BOOT_OUT="out/arch/arm64/boot"
          cp "$BOOT_OUT/Image" anykernel/
          echo "✅ Image copied"
          [ -f "$BOOT_OUT/dtb" ]      && cp "$BOOT_OUT/dtb"      anykernel/ && echo "✅ dtb copied"      || echo "⚠️  dtb not found"
          [ -f "$BOOT_OUT/dtb.img" ]  && cp "$BOOT_OUT/dtb.img"  anykernel/ && echo "✅ dtb.img copied"  || echo "⚠️  dtb.img not found"
          [ -f "$BOOT_OUT/dtbo.img" ] && cp "$BOOT_OUT/dtbo.img" anykernel/ && echo "✅ dtbo.img copied" || echo "⚠️  dtbo.img not found"
      # -------------------------------------------------------------------
      # Zip everything inside anykernel/ into a timestamped flashable ZIP.
      # Format: GFClang-<TAG>-<YYYYMMDD>-<HHMM>.zip
      # e.g.  : GFClang-Perf-20260529-1432.zip
      # Excludes .git metadata and README.md (not needed on device).
      # ZIP_FILE is written to GITHUB_ENV so subsequent steps can find it.
      # -------------------------------------------------------------------
      - name: Create flashable ZIP
        run: |
          # Sanitise the tag — strip spaces and slashes so the filename is safe
          RAW_TAG="${{ github.event.inputs.build_tag }}"
          SAFE_TAG="${RAW_TAG// /-}"       # spaces → hyphens
          SAFE_TAG="${SAFE_TAG//\//-}"     # forward slashes → hyphens
          cd anykernel
          ZIP_NAME="GFClang-${SAFE_TAG}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP_NAME" . -x "*.git*" -x "README.md"
          cd ..
          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Zip created: $ZIP_NAME ($(du -sh $ZIP_NAME | cut -f1))"
      # -------------------------------------------------------------------
      # Generate a Tenzo signing keystore (mirrors generate_secure_keystore
      # in build.sh exactly).  Runs only when enable_signing == 'yes'.
      # The keystore stays in $HOME/.gf — it is NEVER bundled into the
      # ZIP; it is only used by jarsigner in the next step.
      # -------------------------------------------------------------------
      - name: Generate signing keystore
        if: ${{ github.event.inputs.enable_signing == 'yes' }}
        run: |
          set -e
          SIGNER_DIR="$HOME/.gf"
          KEYSTORE="$SIGNER_DIR/keystore.p12"
          # Skip re-generation if the keystore already exists (matches build.sh guard)
          if [ -f "$KEYSTORE" ]; then
            echo "✔ Keystore already exists: $KEYSTORE"
            exit 0
          fi
          echo "Creating new keystore and full trust chain..."
          rm -rf "$SIGNER_DIR"
          mkdir -p "$SIGNER_DIR" && chmod 700 "$SIGNER_DIR"
          PASS=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 18)
          UNIQUE_ID=$(date +%Y%m%d_%H%M%S)
          KEYALIAS="tenzoKey_${UNIQUE_ID}"
          echo "$PASS"     > "$SIGNER_DIR/.store_pass"
          echo "$KEYALIAS" > "$SIGNER_DIR/.alias"
          chmod 600 "$SIGNER_DIR/.store_pass" "$SIGNER_DIR/.alias"
          echo "🔑 Generating Root CA..."
          openssl genrsa -out "$SIGNER_DIR/rootCA.key" 4096
          openssl req -x509 -new -nodes \
            -key "$SIGNER_DIR/rootCA.key" -sha256 -days 9125 \
            -out "$SIGNER_DIR/rootCA.pem" \
            -subj "/CN=Tenzo Root CA/O=Madara273/C=UA"
          echo "🔑 Generating Tenzo keypair + CSR..."
          openssl genrsa -out "$SIGNER_DIR/tenzo.key" 4096
          openssl req -new \
            -key "$SIGNER_DIR/tenzo.key" \
            -out "$SIGNER_DIR/tenzo.csr" \
            -subj "/CN=Tenzo, OU=Root, O=Madara273, L=UA, ST=Ukraine, C=UA"
          openssl x509 -req \
            -in "$SIGNER_DIR/tenzo.csr" \
            -CA "$SIGNER_DIR/rootCA.pem" \
            -CAkey "$SIGNER_DIR/rootCA.key" \
            -CAcreateserial \
            -out "$SIGNER_DIR/tenzo.crt" \
            -sha256 -days 365
          echo "📦 Exporting to PKCS#12..."
          openssl pkcs12 -export \
            -inkey "$SIGNER_DIR/tenzo.key" \
            -in "$SIGNER_DIR/tenzo.crt" \
            -certfile "$SIGNER_DIR/rootCA.pem" \
            -out "$SIGNER_DIR/tenzo.p12" \
            -password pass:"$PASS" \
            -name "$KEYALIAS"
          keytool -importkeystore \
            -srckeystore "$SIGNER_DIR/tenzo.p12" \
            -srcstoretype PKCS12 -srcstorepass "$PASS" \
            -destkeystore "$KEYSTORE" \
            -deststoretype PKCS12 -deststorepass "$PASS" \
            -alias "$KEYALIAS" -noprompt
          # Import rootCA into the keystore itself (matches build.sh)
          keytool -importcert -trustcacerts \
            -alias "rootCA_${UNIQUE_ID}" \
            -file "$SIGNER_DIR/rootCA.pem" \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" -noprompt
          echo "🔑 Adding Root CA to Java truststore..."
          sudo keytool -list -cacerts -storepass changeit \
            -alias "tenzoRoot" >/dev/null 2>&1 && \
            sudo keytool -delete -cacerts -storepass changeit \
              -alias "tenzoRoot" -noprompt || true
          sudo keytool -importcert \
            -alias "tenzoRoot" \
            -file "$SIGNER_DIR/rootCA.pem" \
            -cacerts -storepass changeit -noprompt && \
            echo "✔ Root CA added to Java truststore" || \
            echo "⚠️  Failed to add Root CA to Java truststore"
          echo "✅ Keystore ready: $KEYSTORE"
          # Print SHA256 fingerprint (matches show_fingerprint in build.sh)
          keytool -list -v -keystore "$KEYSTORE" -storepass "$PASS" \
            -alias "$KEYALIAS" 2>/dev/null | grep "SHA256:" || true
          echo "SIGNER_DIR=$SIGNER_DIR" >> $GITHUB_ENV
      # -------------------------------------------------------------------
      # Sign the flashable ZIP using jarsigner — mirrors sign_zip() in
      # build.sh exactly:
      #   1. Copy the unsigned ZIP to a *-signed.zip
      #   2. Run jarsigner with SHA256withRSA + DigiCert TSA
      #   3. Verify the "jar signed." success string
      #   4. Update ZIP_FILE env var to point at the signed copy
      # -------------------------------------------------------------------
      - name: Sign flashable ZIP
        if: ${{ github.event.inputs.enable_signing == 'yes' }}
        run: |
          set -e
          SIGNER_DIR="$HOME/.gf"
          KEYSTORE="$SIGNER_DIR/keystore.p12"
          PASS=$(cat "$SIGNER_DIR/.store_pass")
          KEYALIAS=$(cat "$SIGNER_DIR/.alias")
          UNSIGNED="$ZIP_FILE"
          SIGNED="${UNSIGNED%.zip}-signed.zip"
          echo "📋 Unsigned: $UNSIGNED"
          echo "📋 Signed  : $SIGNED"
          cp "$UNSIGNED" "$SIGNED"
          echo "🔏 Signing ZIP with jarsigner + DigiCert TSA..."
          SIGNING_OUTPUT=$(jarsigner \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -tsa http://timestamp.digicert.com \
            "$SIGNED" "$KEYALIAS" 2>&1)
          echo "$SIGNING_OUTPUT"
          echo "$SIGNING_OUTPUT" | grep -q "jar signed." && {
            echo "✅ ZIP signed successfully: $SIGNED"
            echo "$SIGNING_OUTPUT" | grep -q "The timestamp will expire" && \
              echo "⚠️  $(echo "$SIGNING_OUTPUT" | grep 'The timestamp will expire')"
          } || {
            echo "❌ Signing failed!"
            exit 1
          }
          # Point upload step at the signed ZIP
          echo "ZIP_FILE=$SIGNED" >> $GITHUB_ENV
      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GFClang-${{ github.event.inputs.build_tag }}-Kernel
          path: ${{ env.ZIP_FILE }}

      # -------------------------------------------------------------------
      # Telegram: push the finished, flashable ZIP with build metadata.
      # Only runs if everything up to here succeeded. Telegram's bot API
      # caps uploads at 50MB — if your ZIP regularly exceeds that you'll
      # need a self-hosted Bot API server; this will otherwise fail with
      # a "Request Entity Too Large" style error from Telegram.
      # -------------------------------------------------------------------
      - name: Push ZIP to Telegram
        if: success()
        run: |
          MD5CHECK=$(md5sum "$ZIP_FILE" | cut -d' ' -f1)
          SIZE=$(du -sh "$ZIP_FILE" | cut -f1)
          CAPTION="✅ Build Successful
          Branch: ${{ github.event.inputs.kernel_branch }}
          Tag: ${{ github.event.inputs.build_tag }}
          KernelSU Next: ${{ github.event.inputs.enable_kernelsu_next }}
          Signed: ${{ github.event.inputs.enable_signing }}
          Compiler: Greenforce Clang
          Size: $SIZE
          MD5: $MD5CHECK"
          curl -s -F document=@"$ZIP_FILE" "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F caption="$CAPTION"

      # -------------------------------------------------------------------
      # Telegram: failure notification + build.log, if anything in the
      # job failed. This is the LAST step so it can catch a failure from
      # any earlier step. build.log only exists once the "Configure and
      # build kernel" step has run, so we guard for it.
      # -------------------------------------------------------------------
      - name: Notify Telegram - build failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="html" \
            -d disable_web_page_preview=true \
            -d text="❌ <b>Build Failed</b>%0A<b>Branch:</b> <code>${{ github.event.inputs.kernel_branch }}</code>%0A<b>Tag:</b> <code>${{ github.event.inputs.build_tag }}</code>%0ACheck the Actions log for full details: %0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f build.log ]; then
            curl -s -F document=@build.log "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F caption="Build log for failed run (${{ github.run_id }})"
          fi