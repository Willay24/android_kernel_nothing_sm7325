name: Neutrino
on:
  workflow_dispatch:  # Start only manually
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'Staging-1'
        type: string
      compiler:
        description: 'Compiler to use'
        required: true
        default: 'eva_gcc'
        type: choice
        options:
          - eva_gcc
          - neutron_clang
          - slim_llvm
      enable_kernelsu_next:
        description: 'Enable KernelSU?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_basebandguard:
        description: 'Enable Baseband-guard?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_nomount:
        description: 'Enable NoMount?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      defconfig:
        description: 'Defconfig filename (used for KernelSU CONFIG_KSU / Baseband-guard CONFIG_BBG injection)'
        required: true
        default: 'phone1_defconfig'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # Required step to ensure gcc, clang, and kernel dependencies exist
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev libncurses-dev build-essential ccache zip unzip curl git

      - name: Setup KernelSU (if enabled)
        if: ${{ github.event.inputs.enable_kernelsu_next == 'yes' }}
        run: |
          echo "🔧 Enabling KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s master
          sudo rm -rf KernelSU
          git clone -b master-susfs https://github.com/William24hmar/KernelSU.git KernelSU
          
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.defconfig }}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "✅ Adding CONFIG_KSU=y to defconfig"
            echo -e "\n# KernelSU\nCONFIG_KSU=y" >> "$DEFCONFIG_PATH"
          else
            echo "⚠️ Defconfig not found at $DEFCONFIG_PATH — skipping CONFIG_KSU injection"
          fi

      - name: Setup nomount (if enabled)
        if: ${{ github.event.inputs.enable_nomount == 'yes' }}
        run: |
          echo "🔧 Enabling NoMount..."
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev
          rm -rf NoMount
          git clone -b dev https://github.com/Willay24/nomount.git NoMount
          echo "nomount (dev) setup complete"

      - name: Setup Baseband-guard
        if: ${{ github.event.inputs.enable_basebandguard == 'yes' }}
        run: |
          set -e
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.defconfig }}"
          echo "🛡️ Integrating Baseband-guard LSM..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "✅ Injecting CONFIG_BBG=y into defconfig ($DEFCONFIG_PATH)"
            echo -e "\n# Baseband-guard\nCONFIG_BBG=y" >> "$DEFCONFIG_PATH"
          else
            echo "⚠️ Defconfig not found at $DEFCONFIG_PATH — skipping CONFIG_BBG injection"
          fi
          if [ -f "security/Kconfig" ]; then
            echo "🩹 Patching security/Kconfig LSM default list..."
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
            echo "✅ security/Kconfig patched (baseband_guard added to LSM default list)"
          else
            echo "⚠️ security/Kconfig not found — skipping LSM default patch"
          fi

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Run build.sh
        env:
          COMPILER_CHOICE: ${{ github.event.inputs.compiler == 'slim_llvm' && '3' || (github.event.inputs.compiler == 'neutron_clang' && '2' || '1') }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./build.sh

      - name: Copy built artifacts into accessible directory
        run: |
          mkdir -p artifacts
          OUT_PARENT_DIR="$(dirname $GITHUB_WORKSPACE)"
          
          # Check parent directory out location first, fallback to workspace directory
          if [ -d "$OUT_PARENT_DIR/SPACEWAR_OUT/AnyKernel3" ]; then
            cp "$OUT_PARENT_DIR/SPACEWAR_OUT/AnyKernel3/"*.zip artifacts/ || true
          elif [ -d "$GITHUB_WORKSPACE/SPACEWAR_OUT/AnyKernel3" ]; then
            cp "$GITHUB_WORKSPACE/SPACEWAR_OUT/AnyKernel3/"*.zip artifacts/ || true
          fi

      - name: Upload ZIP files as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel
          path: artifacts/*.zip